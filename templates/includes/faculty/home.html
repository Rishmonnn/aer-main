<div id="home" class="dashboard-grid">
        
    <div class="stats-col">
        <div class="stat-card highlight centered-card">
            <div class="stat-icon-wrapper blue"><i class='bx bxs-group'></i></div>
            <div class="stat-content">
                <h3 class="stat-label">Total Students</h3>
                <div class="stat-value-row centered-row">
                    <span class="val" id="fac-stat-students">-</span>
                </div>
            </div>
        </div>
        
        <div class="stat-card highlight centered-card">
            <div class="stat-icon-wrapper teal"><i class='bx bxs-book-bookmark'></i></div>
            <div class="stat-content">
                <h3 class="stat-label">My Classes</h3>
                <div class="stat-value-row centered-row">
                    <span class="val" id="fac-stat-classes">-</span>
                </div>
            </div>
        </div>
        
        <div class="stat-card highlight centered-card">
            <div class="stat-icon-wrapper red"><i class='bx bxs-bar-chart-alt-2'></i></div>
            <div class="stat-content">
                <h3 class="stat-label">Grading Status</h3>
                <div class="stat-value-row centered-row">
                    <span class="val" id="fac-stat-grading">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="center-col">
        <div class="content-section dashboard-section">
            <div class="section-header accent-header"><i class='bx bx-time-five'></i> RECENT ACTIVITIES</div>
            <div class="feed-container" id="fac-activity-list">
                <div style="padding: 30px; text-align: center; color: #64748b;"><i class='bx bx-loader-alt bx-spin'></i> Loading activities...</div>
            </div>
        </div>
        
        <div class="content-section dashboard-section">
            <div class="section-header accent-header"><i class='bx bx-bulb'></i> QUICK ACTIONS</div>
            <div class="feed-container">
                <div class="actions-list" style="padding: 20px;">
                    <div class="action-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9;">
                        <span class="action-text" style="font-weight: 600; color: #334155;"><i class='bx bx-clipboard' style="color: #90242d; margin-right: 8px;"></i> Input Grades</span>
                        <button class="btn-action" style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: #475569; transition: 0.2s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f8fafc'" onclick="document.querySelector('a[onclick*=\\'classrecords\\']').click()">Go to Grading</button>
                    </div>
                    
                    <div class="action-row" style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="action-text" style="font-weight: 600; color: #334155;"><i class='bx bx-list-ul' style="color: #90242d; margin-right: 8px;"></i> Class Records</span>
                        <button class="btn-action" style="background: #f8fafc; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: #475569; transition: 0.2s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f8fafc'" onclick="document.querySelector('a[onclick*=\\'classrecords\\']').click()">View Classes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="calendar-wrapper">
        <div class="calendar-card">
            <div class="calendar-header-title"><i class='bx bx-calendar-event'></i> CALENDAR</div>
            <div class="calendar-header">
                <div class="calendar-selects">
                    <select id="monthSelect" onchange="updateCalendarFromSelect()">
                        <option value="0">January</option><option value="1">February</option>
                        <option value="2">March</option><option value="3">April</option>
                        <option value="4">May</option><option value="5">June</option>
                        <option value="6">July</option><option value="7">August</option>
                        <option value="8">September</option><option value="9">October</option>
                        <option value="10">November</option><option value="11">December</option>
                    </select>
                    <select id="yearSelect" onchange="updateCalendarFromSelect()">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <div class="calendar-nav-btns">
                    <button class="calendar-btn" onclick="changeMonth(-1)"><i class='bx bx-chevron-left'></i></button>
                    <button class="calendar-btn" onclick="changeMonth(1)"><i class='bx bx-chevron-right'></i></button>
                </div>
            </div>
            <table class="modern-calendar">
                <thead><tr><th>Su</th><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th></tr></thead>
                <tbody id="calendar-body"></tbody>
            </table>
        </div>
    </div>

</div>
